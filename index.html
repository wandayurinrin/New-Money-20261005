<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>探金小秘書 v8.3</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="date"], input[type="month"] { -webkit-appearance: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-blue-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const generateId = () => Math.random().toString(36).substr(2, 9);

        const copyToClipboard = async (text) => {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text);
              return true;
            }
          } catch (err) {}
          try {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            const successful = document.execCommand('copy');
            document.body.removeChild(textArea);
            if (successful) return true;
          } catch (err) {}
          return false;
        };

        const INITIAL_SETTINGS = {
          employees: [
            { name: '帥志', fullRate: 2500, halfRate: 1300 },
            { name: '阿和', fullRate: 2500, halfRate: 1300 },
            { name: '阿翔', fullRate: 2500, halfRate: 1300 },
            { name: '阿孝', fullRate: 2500, halfRate: 1300 }
          ]
        };

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const props = { className, fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" };
            switch(name) {
                case 'add_proj': return <svg {...props} viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>;
                case 'daily': return <svg {...props} viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
                case 'salary': return <svg {...props} viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;
                case 'billing': return <svg {...props} viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
                case 'matrix': return <svg {...props} viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>;
                case 'report': return <svg {...props} viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
                case 'proj_rec': return <svg {...props} viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>;
                case 'stats': return <svg {...props} viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
                case 'settings': return <svg {...props} viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
                default: return null;
            }
        };

        const Card = ({ children, className = "" }) => (
          <div className={`bg-white rounded-lg shadow-sm border border-slate-200/80 p-2.5 ${className}`}>
            {children}
          </div>
        );

        function App() {
          const [activeTab, setActiveTab] = useState('add_proj');
          const [toast, setToast] = useState('');
          const [modal, setModal] = useState(null); 
          const [editingDailyRecord, setEditingDailyRecord] = useState(null);
          const [reportMonthFilter, setReportMonthFilter] = useState(() => new Date().toISOString().slice(0,7));
          
          const [projects, setProjects] = useState(() => JSON.parse(localStorage.getItem('v8_projects') || '[]'));
          const [records, setRecords] = useState(() => JSON.parse(localStorage.getItem('v8_records') || '[]'));
          const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('v8_settings') || JSON.stringify(INITIAL_SETTINGS)));
          const [billings, setBillings] = useState(() => JSON.parse(localStorage.getItem('v8_billings') || '{}')); 
          const [manualSalaries, setManualSalaries] = useState(() => JSON.parse(localStorage.getItem('v8_manual_salaries') || '{}'));

          useEffect(() => { localStorage.setItem('v8_projects', JSON.stringify(projects)); }, [projects]);
          useEffect(() => { localStorage.setItem('v8_records', JSON.stringify(records)); }, [records]);
          useEffect(() => { localStorage.setItem('v8_settings', JSON.stringify(settings)); }, [settings]);
          useEffect(() => { localStorage.setItem('v8_billings', JSON.stringify(billings)); }, [billings]);
          useEffect(() => { localStorage.setItem('v8_manual_salaries', JSON.stringify(manualSalaries)); }, [manualSalaries]);

          const showToast = (msg) => {
            setToast(msg);
            setTimeout(() => setToast(''), 3000);
          };

          const confirmDelete = (title, msg, onConfirm) => {
            setModal({ type: 'delete', title, msg, onConfirm });
          };

          const handleEditDaily = (record) => {
            setEditingDailyRecord(record);
            setActiveTab('daily');
            window.scrollTo(0,0);
          };

          const handleJumpToReport = (month) => {
            setReportMonthFilter(month);
            setActiveTab('report');
            window.scrollTo(0,0);
          };

          const navItems = [
            { id: 'add_proj', icon: 'add_proj', label: '新增工程' },
            { id: 'daily', icon: 'daily', label: '每日紀錄' },
            { id: 'salary', icon: 'salary', label: '薪資＆出勤' },
            { id: 'billing', icon: 'billing', label: '請款' },
            { id: 'matrix', icon: 'matrix', label: '月報' },
            { id: 'report', icon: 'report', label: '日報' },
            { id: 'proj_rec', icon: 'proj_rec', label: '工程紀錄' },
            { id: 'stats', icon: 'stats', label: '統計' },
            { id: 'settings', icon: 'settings', label: '設定' }
          ];

          return (
            <div className="min-h-screen bg-slate-100 text-slate-800 pb-16 md:pb-4 text-xs">
              {toast && (
                <div className="fixed top-4 right-4 bg-slate-800 text-white px-3 py-1.5 rounded-md shadow-lg z-50 text-xs font-bold animate-pulse">
                  {toast}
                </div>
              )}

              {modal && modal.type === 'delete' && (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                  <div className="bg-white rounded-lg shadow-xl p-4 w-full max-w-xs">
                    <h3 className="font-bold text-sm mb-1">{modal.title}</h3>
                    <p className="text-slate-500 mb-4">{modal.msg}</p>
                    <div className="flex gap-2 justify-end">
                      <button onClick={() => setModal(null)} className="px-3 py-1.5 bg-slate-100 rounded text-slate-600 font-bold">取消</button>
                      <button onClick={() => { modal.onConfirm(); setModal(null); }} className="px-3 py-1.5 bg-red-500 text-white rounded font-bold">確認刪除</button>
                    </div>
                  </div>
                </div>
              )}

              <header className="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
                <div className="max-w-5xl mx-auto px-2 py-2 flex items-center justify-between">
                  <div className="flex items-center gap-1.5">
                    <span className="text-xl">💰</span>
                    <h1 className="font-extrabold text-sm tracking-wide">探金小秘書</h1>
                  </div>
                  <nav className="hidden md:flex gap-1 overflow-x-auto hide-scrollbar">
                    {navItems.map(tab => (
                      <button key={tab.id} onClick={() => { setActiveTab(tab.id); if(tab.id!=='daily') setEditingDailyRecord(null); }} className={`px-2 py-1.5 rounded-md font-bold flex items-center gap-1 whitespace-nowrap transition-colors ${activeTab === tab.id ? 'bg-blue-600' : 'text-slate-400 hover:text-white'}`}>
                        <Icon name={tab.icon} className="w-3.5 h-3.5" />
                        {tab.label}
                      </button>
                    ))}
                  </nav>
                </div>
              </header>

              <main className="max-w-5xl mx-auto p-2">
                {activeTab === 'add_proj' && <TabAddProject projects={projects} setProjects={setProjects} showToast={showToast} confirmDelete={confirmDelete} />}
                {activeTab === 'daily' && <TabDailyRecord projects={projects} records={records} setRecords={setRecords} settings={settings} showToast={showToast} setActiveTab={setActiveTab} editingDailyRecord={editingDailyRecord} setEditingDailyRecord={setEditingDailyRecord} />}
                {activeTab === 'salary' && <TabSalary records={records} settings={settings} projects={projects} manualSalaries={manualSalaries} setManualSalaries={setManualSalaries} />}
                {activeTab === 'billing' && <TabBilling projects={projects} records={records} billings={billings} setBillings={setBillings} showToast={showToast} />}
                {activeTab === 'matrix' && <TabMatrix projects={projects} records={records} onJumpToReport={handleJumpToReport} />}
                {activeTab === 'report' && <TabReport records={records} projects={projects} onEdit={handleEditDaily} onDelete={(id) => confirmDelete('刪除紀錄', '確定要刪除這筆日報嗎？', () => setRecords(prev => prev.filter(r => r.id !== id)))} initialMonth={reportMonthFilter} />}
                {activeTab === 'proj_rec' && <TabProjectRecord projects={projects} records={records} onEdit={handleEditDaily} />}
                {activeTab === 'stats' && <TabStats records={records} />}
                {activeTab === 'settings' && <TabSettings settings={settings} setSettings={setSettings} projects={projects} setProjects={setProjects} records={records} setRecords={setRecords} billings={billings} setBillings={setBillings} manualSalaries={manualSalaries} setManualSalaries={setManualSalaries} showToast={showToast} />}
              </main>

              <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-between px-0.5 py-1 z-40 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] overflow-x-auto hide-scrollbar">
                {navItems.map(tab => (
                  <button key={tab.id} onClick={() => { setActiveTab(tab.id); if(tab.id!=='daily') setEditingDailyRecord(null); }} className={`flex flex-col items-center justify-center p-1 min-w-[42px] flex-1 rounded ${activeTab === tab.id ? 'text-blue-600' : 'text-slate-400'}`}>
                    <Icon name={tab.icon} className={`w-4 h-4 mb-0.5 ${activeTab === tab.id ? 'stroke-[2.5px]' : ''}`} />
                    <span className={`text-[8px] whitespace-nowrap ${activeTab === tab.id ? 'font-extrabold' : 'font-medium'}`}>{tab.label}</span>
                  </button>
                ))}
              </nav>
            </div>
          );
        }

        function TabAddProject({ projects, setProjects, showToast, confirmDelete }) {
          const emptyProj = { id: '', type: '發包', name: '', client: '', location: '', startDate: '', endDate: '', tasks: [{id: generateId(), name: '', qty: 1, price: 0, total: 0}] };
          const [form, setForm] = useState(emptyProj);

          const updateForm = (k, v) => setForm(p => ({ ...p, [k]: v }));
          const updateTask = (id, k, v) => {
            setForm(p => ({
              ...p, tasks: p.tasks.map(t => {
                if(t.id !== id) return t;
                const nt = { ...t, [k]: k==='name'?v:(Number(v)||0) };
                nt.total = nt.qty * nt.price;
                return nt;
              })
            }));
          };
          const addTask = () => setForm(p => ({ ...p, tasks: [...p.tasks, {id: generateId(), name: '', qty: 1, price: 0, total: 0}] }));
          const removeTask = (id) => setForm(p => ({ ...p, tasks: p.tasks.filter(t => t.id !== id) }));

          const handleSave = () => {
            if(!form.name.trim()) return showToast('請輸入工程名稱');
            const cleanTasks = form.tasks.filter(t => t.name.trim());
            const projToSave = { ...form, tasks: cleanTasks };
            
            if(form.id) {
              setProjects(prev => prev.map(p => p.id === form.id ? projToSave : p));
              showToast('更新成功');
            } else {
              setProjects(prev => [{ ...projToSave, id: generateId() }, ...prev]);
              showToast('新增成功');
            }
            setForm(emptyProj);
          };

          const handleEdit = (p) => {
            setForm({
              ...p,
              tasks: p.tasks && p.tasks.length > 0 ? p.tasks : [{id: generateId(), name: '', qty: 1, price: 0, total: 0}]
            });
            window.scrollTo(0,0);
          };

          const moveProject = (index, direction) => {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= projects.length) return;
            const updated = [...projects];
            const temp = updated[index];
            updated[index] = updated[newIndex];
            updated[newIndex] = temp;
            setProjects(updated);
          };

          return (
            <div className="space-y-2">
              <Card>
                <div className="font-bold text-slate-500 mb-2 border-b pb-1">新增工程</div>
                <div className="flex gap-4 mb-2 text-blue-700 font-bold">
                  {['發包', '計時', '維修'].map(t => (
                    <label key={t} className="flex items-center gap-1 cursor-pointer">
                      <input type="radio" name="projType" checked={form.type===t} onChange={() => updateForm('type', t)} className="accent-blue-600" /> {t}
                    </label>
                  ))}
                </div>
                
                <div className="flex flex-nowrap gap-1 mb-2">
                  <input type="text" placeholder="工程名稱" value={form.name} onChange={e=>updateForm('name', e.target.value)} className="w-1/3 p-1.5 border rounded bg-slate-50 outline-none font-bold" />
                  <input type="text" placeholder="客戶" value={form.client} onChange={e=>updateForm('client', e.target.value)} className="w-1/3 p-1.5 border rounded bg-slate-50 outline-none" />
                  <input type="text" placeholder="地點" value={form.location} onChange={e=>updateForm('location', e.target.value)} className="w-1/3 p-1.5 border rounded bg-slate-50 outline-none" />
                </div>

                <div className="flex gap-1 mb-2">
                  <div className="w-1/2 flex items-center border rounded bg-slate-50 p-1.5">
                    <span className="text-[10px] text-slate-400 font-bold w-8">開始</span>
                    <input type="date" value={form.startDate} onChange={e=>updateForm('startDate', e.target.value)} className="flex-1 bg-transparent outline-none" />
                  </div>
                  <div className="w-1/2 flex items-center border rounded bg-slate-50 p-1.5">
                    <span className="text-[10px] text-slate-400 font-bold w-8">結束</span>
                    <input type="date" value={form.endDate} onChange={e=>updateForm('endDate', e.target.value)} className="flex-1 bg-transparent outline-none" />
                  </div>
                </div>

                <div className="space-y-1 bg-slate-50/50 p-1.5 border rounded-lg">
                  <div className="flex px-1 text-[10px] font-bold text-slate-400 gap-1">
                    <div className="flex-1">工作項目</div>
                    <div className="w-12 text-center">數量</div>
                    <div className="w-16 text-center">單價</div>
                    <div className="w-16 text-right mr-5">金額</div>
                  </div>
                  {form.tasks.map((t) => (
                    <div key={t.id} className="flex gap-1 items-center bg-white p-1 rounded border border-slate-200">
                      <input type="text" placeholder="項目名稱" value={t.name} onChange={e=>updateTask(t.id, 'name', e.target.value)} className="flex-1 p-1 outline-none text-[11px]" />
                      <input type="number" placeholder="數量" value={t.qty||''} onChange={e=>updateTask(t.id, 'qty', e.target.value)} className="w-10 p-1 bg-slate-50 border rounded outline-none text-[11px] text-center" />
                      <input type="number" placeholder="單價" value={t.price||''} onChange={e=>updateTask(t.id, 'price', e.target.value)} className="w-14 p-1 bg-slate-50 border rounded outline-none text-[11px] text-right" />
                      <div className="w-14 text-right font-bold text-slate-600 text-[11px]">${t.total}</div>
                      <button onClick={()=>removeTask(t.id)} className="text-red-500 hover:bg-red-50 p-1 rounded font-bold shrink-0">✕</button>
                    </div>
                  ))}
                  <button onClick={addTask} className="text-blue-600 font-bold px-1 mt-1 text-[11px]">+ 新增工作項目</button>
                </div>

                <div className="mt-3 flex gap-2">
                  {form.id && <button onClick={() => setForm(emptyProj)} className="flex-1 py-2 bg-slate-200 text-slate-700 rounded font-bold">取消編輯</button>}
                  <button onClick={handleSave} className="flex-[2] py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-bold shadow-sm transition-colors">{form.id ? '更新工程' : '儲存工程'}</button>
                </div>
              </Card>

              <Card>
                <div className="font-bold text-slate-500 mb-2 border-b pb-1 flex justify-between items-center">
                  <span>已建立工程專案 (可上下排序，月報將依此排序呈現)</span>
                </div>
                <div className="space-y-1.5">
                  {projects.map((p, index) => (
                    <div key={p.id} className="bg-slate-50 border border-slate-200 rounded-lg p-2 flex justify-between items-center">
                      <div className="flex items-center gap-1.5 shrink-0 pr-1">
                        <button onClick={()=>moveProject(index, -1)} disabled={index === 0} className="w-6 h-6 bg-white border border-slate-200 rounded flex items-center justify-center text-slate-600 font-bold disabled:opacity-30">▲</button>
                        <button onClick={()=>moveProject(index, 1)} disabled={index === projects.length - 1} className="w-6 h-6 bg-white border border-slate-200 rounded flex items-center justify-center text-slate-600 font-bold disabled:opacity-30">▼</button>
                      </div>
                      <div className="flex-1 min-w-0 px-1">
                        <div className="text-sm font-bold text-slate-800 truncate mb-0.5">
                          <span className="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-bold mr-1.5 align-middle">{p.type}</span>
                          {p.name} <span className="text-[11px] font-medium text-slate-500 ml-1">- 客戶：{p.client} - 地點：{p.location}</span>
                        </div>
                        <div className="text-[10px] text-slate-400 font-medium">日期：{p.startDate || '未定'} ~ {p.endDate || '未定'} | {p.tasks.length} 項目</div>
                      </div>
                      <div className="flex gap-1.5 shrink-0">
                        <button onClick={()=>handleEdit(p)} className="px-2.5 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded text-[10px] font-bold transition-colors">編輯</button>
                        <button onClick={()=>confirmDelete('刪除專案', `確定要刪除「${p.name}」嗎？`, () => setProjects(pr=>pr.filter(x=>x.id!==p.id)))} className="px-2.5 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded text-[10px] font-bold transition-colors">刪除</button>
                      </div>
                    </div>
                  ))}
                  {projects.length===0 && <div className="text-center text-slate-400 py-4 font-medium">尚無專案</div>}
                </div>
              </Card>
            </div>
          );
        }

        function TabDailyRecord({ projects, records, setRecords, settings, showToast, setActiveTab, editingDailyRecord, setEditingDailyRecord }) {
          const today = new Date().toISOString().split('T')[0];
          const emptyRec = { id: '', date: today, employees: [], materials: [], expenses: [] };
          const [form, setForm] = useState(emptyRec);
          const [selectedMatProj, setSelectedMatProj] = useState('');
          const [selectedExpProj, setSelectedExpProj] = useState('');
          
          useEffect(() => {
            if (editingDailyRecord) setForm(editingDailyRecord);
            else setForm(emptyRec);
          }, [editingDailyRecord]);

          const projOptions = projects.map(p => ({ value: p.id, label: p.name, tasks: p.tasks.map(t=>t.name) }));

          const toggleEmployee = (empName) => {
            setForm(prev => {
              const exists = prev.employees.find(e => e.name === empName);
              if (exists) return { ...prev, employees: prev.employees.filter(e => e.name !== empName) };
              const rate = settings.employees.find(e => e.name === empName)?.fullRate || 0;
              return { 
                ...prev, 
                employees: [...prev.employees, { id: generateId(), name: empName, dayType: '全天', salary: rate, projects: [{id: generateId(), projId: '', taskName: ''}], allowances: [] }] 
              };
            });
          };

          const updateEmp = (id, k, v) => {
            setForm(prev => ({
              ...prev, employees: prev.employees.map(e => {
                if(e.id !== id) return e;
                const ne = { ...e, [k]: v };
                if(k === 'dayType') {
                  const baseRate = settings.employees.find(x => x.name === e.name);
                  if(baseRate) ne.salary = v === '全天' ? baseRate.fullRate : (v === '半天' ? baseRate.halfRate : 0);
                }
                return ne;
              })
            }));
          };

          const addEmpProj = (empId) => setForm(p => ({
            ...p, employees: p.employees.map(e => e.id === empId ? { ...e, projects: [...e.projects, {id: generateId(), projId: '', taskName: ''}] } : e)
          }));
          const updateEmpProj = (empId, pId, k, v) => setForm(p => ({
            ...p, employees: p.employees.map(e => e.id === empId ? {
              ...e, projects: e.projects.map(pr => pr.id === pId ? { ...pr, [k]: v } : pr)

        function TabSalary({ records, settings, projects, manualSalaries, setManualSalaries }) {
          const [month, setMonth] = useState(new Date().toISOString().slice(0,7));
          const [empFilter, setEmpFilter] = useState('全部');
          const [expanded, setExpanded] = useState({});

          const updateManualSal = (empName, val) => {
            setManualSalaries(prev => ({ ...prev, [`${empName}_${month}`]: val ? Number(val) : '' }));
          };

          const stats = useMemo(() => {
            const filteredRecs = records.filter(r => r.date.startsWith(month));
            const empMap = {};
            
            settings.employees.forEach(e => empMap[e.name] = { name: e.name, days: 0, holidayDays: 0, baseSalary: 0, allowances: 0, details: [] });
            
            filteredRecs.forEach(r => {
              r.employees.forEach(e => {
                if(!empMap[e.name]) empMap[e.name] = { name: e.name, days: 0, holidayDays: 0, baseSalary: 0, allowances: 0, details: [] };
                
                if(e.dayType === '休假') {
                   empMap[e.name].holidayDays += 1;
                   empMap[e.name].details.push({ date: r.date, type: '休假', proj: '休假', task: '休假', amount: 0 });
                } else {
                   empMap[e.name].days += e.dayType === '半天' ? 0.5 : 1;
                   const projMap = {};
                   e.projects.forEach(pr => {
                      if(!projMap[pr.projId]) projMap[pr.projId] = [];
                      if(pr.taskName) projMap[pr.projId].push(pr.taskName);
                   });
                   
                   Object.entries(projMap).forEach(([pId, tasks]) => {
                      const pName = projects.find(x => x.id === pId)?.name || '未命名工程';
                      empMap[e.name].details.push({
                         date: r.date,
                         type: e.dayType,
                         proj: pName,
                         task: tasks.join('、') || '無摘要',
                         amount: e.projects.length > 0 ? Math.round((Number(e.salary)||0) / Object.keys(projMap).length) : (Number(e.salary)||0)
                      });
                   });
                   if(e.projects.length===0) empMap[e.name].details.push({ date: r.date, type: e.dayType, proj: '無', task: '無', amount: Number(e.salary)||0 });
                }
                
                empMap[e.name].baseSalary += Number(e.salary)||0;
                
                (e.allowances||[]).forEach(a => {
                   empMap[e.name].allowances += Number(a.amount)||0;
                   empMap[e.name].details.push({
                      date: r.date, type: '津貼', proj: `[津貼] ${a.name}`, task: '', amount: Number(a.amount)||0
                   });
                });
              });
            });

            let list = Object.values(empMap).filter(x => x.days > 0 || x.holidayDays > 0);
            if(empFilter !== '全部') list = list.filter(x => x.name === empFilter);
            return list;
          }, [records, month, empFilter, settings, projects]);

          return (
            <div className="space-y-2">
              <Card className="flex gap-2 items-center">
                <input type="month" value={month} onChange={e=>setMonth(e.target.value)} className="w-1/2 p-1.5 border border-slate-200 rounded bg-slate-50 font-bold outline-none" />
                <select value={empFilter} onChange={e=>setEmpFilter(e.target.value)} className="w-1/2 p-1.5 border border-slate-200 rounded bg-slate-50 font-bold outline-none">
                  <option>全部員工</option>
                  {settings.employees.map(e=><option key={e.name}>{e.name}</option>)}
                </select>
              </Card>

              {stats.map(s => {
                const manual = manualSalaries[`${s.name}_${month}`];
                const calculatedTotal = s.baseSalary + s.allowances;
                const finalSal = manual !== undefined && manual !== '' ? manual : calculatedTotal;
                
                return (
                  <Card key={s.name} className="p-0 overflow-hidden border-slate-200">
                    <div className="p-2.5 bg-white select-none">
                      <div className="flex justify-between items-center mb-1 cursor-pointer" onClick={()=>setExpanded(p=>({...p, [s.name]: !p[s.name]}))}>
                        <div className="flex items-center gap-1.5">
                          <span className={`w-4 h-4 rounded flex items-center justify-center text-[9px] font-bold ${expanded[s.name] ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-500'}`}>{expanded[s.name]?'▲':'▼'}</span>
                          <span className="font-extrabold text-sm">{s.name}</span>
                        </div>
                        <div className="flex items-center gap-1 font-bold text-emerald-600" onClick={e=>e.stopPropagation()}>
                          <span>$</span>
                          <input type="number" value={finalSal} onChange={e=>updateManualSal(s.name, e.target.value)} placeholder={calculatedTotal} className="w-20 p-1 bg-emerald-50 border border-emerald-100 rounded text-right outline-none text-sm shadow-inner" />
                        </div>
                      </div>
                      <div className="flex justify-between text-[10px] text-slate-500 font-bold mt-1.5 px-0.5">
                        <span>出勤: <span className="text-blue-600">{s.days}</span> 天 | 休假: <span className="text-amber-600">{s.holidayDays}</span> 天</span>
                        <span>工資: ${s.baseSalary.toLocaleString()} | 津貼: ${s.allowances.toLocaleString()}</span>
                      </div>
                    </div>
                    
                    {expanded[s.name] && (
                      <div className="p-2 bg-slate-50 border-t border-slate-100 space-y-1">
                        {s.details.sort((a,b)=>a.date.localeCompare(b.date)).map((d, i) => (
                          <div key={i} className={`flex text-[10px] bg-white p-1.5 border border-slate-200 rounded items-center gap-1.5 ${d.type==='休假'?'border-l-2 border-l-amber-400':''} ${d.type==='津貼'?'border-l-2 border-l-emerald-400':''}`}>
                            <div className="font-mono text-slate-400 w-10 shrink-0 text-left">{d.date.slice(5)}</div>
                            <div className={`w-8 shrink-0 font-bold text-left ${d.type==='休假'?'text-amber-600':d.type==='津貼'?'text-emerald-600':'text-slate-600'}`}>{d.type}</div>
                            <div className="w-[32%] truncate font-bold text-slate-800 text-left" title={d.proj}>{d.proj}</div>
                            <div className="flex-1 truncate text-slate-500 text-left" title={d.task}>{d.task}</div>
                            <div className={`font-bold text-right shrink-0 w-12 ${d.type==='休假'?'text-slate-400':'text-emerald-600'}`}>{d.amount>0 ? `$${d.amount.toLocaleString()}` : '-'}</div>
                          </div>
                        ))}
                      </div>
                    )}
                  </Card>
                );
              })}
              {stats.length===0 && <div className="text-center text-slate-400 py-6 font-bold bg-white rounded-lg border border-slate-200">本月無薪資紀錄</div>}
            </div>
          );
        }

        function TabBilling({ projects, records, billings, setBillings }) {
          const [month, setMonth] = useState(new Date().toISOString().slice(0,7));
          const [client, setClient] = useState('全部');
          
          const clients = useMemo(() => ['全部', ...new Set(projects.map(p=>p.client).filter(Boolean))], [projects]);
          
          const projStats = useMemo(() => {
            const map = {};
            records.filter(r => r.date.startsWith(month)).forEach(r => {
              
              [...r.materials, ...r.expenses].forEach(x => {
                if(x.projId) {
                  if(!map[x.projId]) map[x.projId] = { cost: 0, itemRecs: [], laborByDate: {} };
                  map[x.projId].cost += Number(x.total)||0; 
                  map[x.projId].itemRecs.push({ date: r.date, name: x.name, total: x.total, billable: x.billable });
                }
              });

              r.employees.forEach(e => {
                e.projects.filter(pr => pr.projId).forEach(pr => {
                   if(!map[pr.projId]) map[pr.projId] = { cost: 0, itemRecs: [], laborByDate: {} };
                   const costShare = (Number(e.salary)||0) / e.projects.length;
                   let allowShare = 0;
                   (e.allowances||[]).forEach(a => allowShare += (Number(a.amount)||0) / e.projects.length);
                   map[pr.projId].cost += costShare + allowShare;

                   if (!map[pr.projId].laborByDate[r.date]) {
                       map[pr.projId].laborByDate[r.date] = { workers: new Set(), tasks: new Set() };
                   }
                   map[pr.projId].laborByDate[r.date].workers.add(e.name);
                   if (pr.taskName) map[pr.projId].laborByDate[r.date].tasks.add(pr.taskName);
                });
              });
            });

            return Object.keys(map).map(pId => {
              const p = projects.find(x => x.id === pId) || { name: '未知', client: '未知' };
              const billingKey = `${pId}_${month}`;

              const laborRecs = Object.keys(map[pId].laborByDate).map(date => ({
                  date,
                  count: map[pId].laborByDate[date].workers.size,
                  tasks: Array.from(map[pId].laborByDate[date].tasks).join('、') || '無摘要'
              })).sort((a,b) => a.date.localeCompare(b.date));

              return { 
                id: pId, name: p.name, client: p.client, cost: Math.round(map[pId].cost), 
                itemRecs: map[pId].itemRecs.sort((a,b) => a.date.localeCompare(b.date)),
                laborRecs, 
                billing: billings[billingKey] !== undefined ? billings[billingKey] : Math.round(map[pId].cost)
              };
            }).filter(x => client === '全部' || x.client === client);
          }, [records, projects, month, client, billings]);

          const updateBilling = (pId, val) => {
            setBillings(prev => ({ ...prev, [`${pId}_${month}`]: Number(val)||0 }));
          };

          return (
            <div className="space-y-2">
              <Card className="flex gap-2 items-center">
                <input type="month" value={month} onChange={e=>setMonth(e.target.value)} className="w-1/2 p-1.5 border border-slate-200 rounded bg-slate-50 font-bold outline-none" />
                <select value={client} onChange={e=>setClient(e.target.value)} className="w-1/2 p-1.5 border border-slate-200 rounded bg-slate-50 font-bold outline-none">
                  {clients.map(c=><option key={c}>{c}</option>)}
                </select>
              </Card>

              {projStats.map(ps => (
                <Card key={ps.id} className="space-y-2 border-slate-200">
                  <div className="font-extrabold text-sm">{ps.name} <span className="text-[10px] text-slate-500 font-normal ml-1">- 客戶：{ps.client}</span></div>
                  
                  <div className="flex gap-2 items-center bg-slate-50 p-2 rounded-lg border border-slate-200">
                    <div className="w-1/3 text-center border-r border-slate-200 pr-1">
                      <div className="text-[9px] text-slate-400 font-bold mb-0.5">估算成本</div>
                      <div className="font-bold text-slate-700">${ps.cost.toLocaleString()}</div>
                    </div>
                    <div className="w-2/3 flex items-center gap-1.5 pl-1">
                      <span className="text-[10px] font-bold text-emerald-600 whitespace-nowrap">請款金額</span>
                      <div className="flex-1 flex items-center bg-white border border-emerald-300 rounded overflow-hidden shadow-inner min-w-0">
                        <span className="text-emerald-700 font-bold pl-2 text-xs shrink-0">$</span>
                        <input type="number" value={ps.billing} onChange={e=>updateBilling(ps.id, e.target.value)} className="w-full p-1.5 font-bold text-emerald-700 bg-transparent outline-none text-right text-sm min-w-0" />
                      </div>
                    </div>
                  </div>

                  <details className="text-[10px] group">
                    <summary className="font-bold text-blue-600 cursor-pointer list-none flex justify-between items-center bg-blue-50/50 hover:bg-blue-50 p-2 rounded-lg transition-colors border border-blue-100">
                      <span>查看請款明細 (人力/耗材/雜支)</span> <span className="group-open:rotate-180 transition-transform text-[8px]">▼</span>
                    </summary>
                    <div className="mt-1 space-y-2 p-1.5 bg-white border border-slate-100 rounded-lg">
                      
                      {ps.laborRecs.length > 0 && (
                        <div>
                           <div className="text-[10px] font-bold text-slate-500 mb-1 border-b border-slate-100 pb-1 px-1">👷 人力明細</div>
                           {ps.laborRecs.map((r,i) => (
                             <div key={'l'+i} className="flex items-center border-b border-slate-50 last:border-0 pb-1.5 pt-0.5 px-1 last:pb-0.5 gap-2">
                               <span className="text-slate-400 font-mono w-10 shrink-0 text-left">{r.date.slice(5)}</span>
                               <span className="font-bold text-blue-600 w-8 shrink-0 text-left">{r.count} 人</span>
                               <span className="font-bold flex-1 text-slate-700 truncate text-left">{r.tasks}</span>
                             </div>
                           ))}
                        </div>
                      )}

                      {ps.itemRecs.length > 0 && (
                        <div>
                           <div className={`text-[10px] font-bold text-slate-500 mb-1 border-b border-slate-100 pb-1 px-1 ${ps.laborRecs.length > 0 ? 'mt-1' : ''}`}>📦 其他費用</div>
                           {ps.itemRecs.map((r,i) => (
                             <div key={'i'+i} className="flex justify-between items-center border-b border-slate-50 last:border-0 pb-1.5 pt-0.5 px-1 last:pb-0.5">
                               <span className="text-slate-400 font-mono w-10 shrink-0 text-left">{r.date.slice(5)}</span>
                               <span className="font-bold flex-1 text-slate-700 truncate text-left">{r.name} {r.billable && <span className="text-[8px] bg-emerald-100 text-emerald-600 px-1 py-0.5 rounded ml-1 font-normal">請款</span>}</span>
                               <span className="font-bold text-slate-600 shrink-0 ml-2 text-right">${r.total}</span>
                             </div>
                           ))}
                        </div>
                      )}

                      {ps.laborRecs.length === 0 && ps.itemRecs.length === 0 && (
                        <div className="text-center text-slate-400 py-2 font-medium">無人力與費用明細</div>
                      )}
                    </div>
                  </details>
                </Card>
              ))}
              {projStats.length===0 && <div className="text-center text-slate-400 py-6 font-bold bg-white rounded-lg border border-slate-200">本月無請款資料</div>}
            </div>
          );
        }

        function TabMatrix({ projects, records, onJumpToReport }) {
          const [month, setMonth] = useState(() => new Date().toISOString().slice(0,7));

          const daysInMonth = useMemo(() => {
            const [y, m] = month.split('-');
            const count = new Date(y, m, 0).getDate();
            const arr = [];
            for(let i = 1; i <= count; i++) {
              arr.push(`${month}-${String(i).padStart(2,'0')}`);
            }
            return arr;
          }, [month]);

          const matrixData = useMemo(() => {
            const map = {};
            records.filter(r => r.date.startsWith(month)).forEach(r => {
              map[r.date] = map[r.date] || {};
              
              projects.forEach(p => {
                let workersCount = 0;
                let hasFull = false;
                let hasHalf = false;
                let totalCost = 0;
                let matTotal = 0;
                let expTotal = 0;

                r.employees.forEach(e => {
                  const matchPr = e.projects.find(pr => pr.projId === p.id);
                  if(matchPr) {
                    workersCount++;
                    if(e.dayType === '半天') hasHalf = true; else hasFull = true;
                    totalCost += (Number(e.salary)||0) / e.projects.length;
                    (e.allowances||[]).forEach(a => totalCost += (Number(a.amount)||0) / e.projects.length);
                  }
                });

                r.materials.forEach(m => {
                  if(m.projId === p.id) { matTotal += Number(m.total)||0; totalCost += Number(m.total)||0; }
                });

                r.expenses.forEach(ex => {
                  if(ex.projId === p.id) { expTotal += Number(ex.total)||0; totalCost += Number(ex.total)||0; }
                });

                if(workersCount > 0 || matTotal > 0 || expTotal > 0) {
                  let shiftText = '全';
                  if(hasFull && hasHalf) shiftText = '全半';
                  else if(hasHalf) shiftText = '半';

                  map[r.date][p.id] = {
                    workersCount,
                    shiftText,
                    totalCost: Math.round(totalCost),
                    matTotal,
                    expTotal
                  };
                }
              });
            });
            return map;
          }, [records, projects, month]);

          return (
            <div className="space-y-3">
              <Card className="flex gap-2 items-center">
                <input type="month" value={month} onChange={e=>setMonth(e.target.value)} className="w-full p-2 border border-slate-200 rounded-lg bg-slate-50 font-bold outline-none text-sm text-center" />
              </Card>

              {projects.length === 0 ? (
                <div className="text-center text-slate-400 py-10 bg-white rounded-xl border border-slate-200 font-bold">請先至「新增工程」建立工程專案</div>
              ) : (
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="overflow-x-auto hide-scrollbar">
                    <table className="w-full border-collapse text-left text-[11px] table-fixed">
                      <thead>
                        <tr className="bg-slate-900 text-white border-b border-slate-800">
                          <th className="p-2 font-extrabold sticky left-0 bg-slate-900 z-10 text-center shadow-[2px_0_5px_rgba(0,0,0,0.1)] w-[45px]">日期</th>
                          {projects.map(p => (
                            <th key={p.id} className="p-1.5 font-bold text-center border-l border-slate-800 w-[70px] truncate" title={p.name}>
                              <div className="truncate text-[10px]">{p.name}</div>
                            </th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {daysInMonth.map(date => {
                          const row = matrixData[date] || {};
                          const hasAnyData = projects.some(p => row[p.id]);
                          if(!hasAnyData) return null; // 自動隱藏無紀錄的日期

                          return (
                            <tr key={date} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                              <td className="p-1.5 font-mono font-bold text-slate-600 sticky left-0 bg-slate-50 z-10 text-center border-r border-slate-100 shadow-[2px_0_5px_rgba(0,0,0,0.02)]">
                                {date.slice(8)}
                              </td>
                              {projects.map(p => {
                                const cell = row[p.id];
                                if(!cell) {
                                  return <td key={p.id} className="p-1 text-center text-slate-200 border-l border-slate-100">-</td>;
                                }

                                return (
                                  <td key={p.id} className="p-1 border-l border-slate-100">
                                    <div 
                                      onClick={() => onJumpToReport(month)} 
                                      className="bg-blue-50/70 hover:bg-blue-100 border border-blue-200/50 rounded p-1 cursor-pointer transition-all text-center"
                                      title="點擊前往日報"
                                    >
                                      <div className="font-black text-blue-900 text-[10px] truncate">
                                        {cell.workersCount}({cell.shiftText})
                                      </div>
                                      <div className="text-[9px] text-emerald-700 font-extrabold">
                                        ${cell.totalCost}
                                      </div>
                                    </div>
                                  </td>
                                );
                              })}
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  {Object.keys(matrixData).length === 0 && (
                    <div className="text-center text-slate-400 py-10 font-medium">本月尚無任何工程日報對照紀錄</div>
                  )}
                </div>
              )}
            </div>
          );
        }

        function TabProjectRecord({ projects, records, onEdit }) {
          const [projFilter, setProjFilter] = useState('全部');
          const [expandedObj, setExpandedObj] = useState({});

          const toggle = (key, e) => {
             if(e) e.stopPropagation();
             setExpandedObj(p => ({ ...p, [key]: !p[key] }));
          };

          const pStats = useMemo(() => {
            return projects.filter(p => projFilter === '全部' || p.id === projFilter).map(p => {
              const recs = [];
              let salCost=0, matCost=0, othCost=0;

              records.forEach(r => {
                let dayWorkers = [];
                let dayTasks = new Set();
                let dayAdded = false;

                r.employees.forEach(e => {
                  const pr = e.projects.find(x => x.projId === p.id);
                  if(pr) {
                    dayWorkers.push(e.name);
                    if(pr.taskName) dayTasks.add(pr.taskName);
                    salCost += (Number(e.salary)||0) / e.projects.length;
                    dayAdded = true;
                  }
                });
                
                const mats = r.materials.filter(m => m.projId === p.id);
                mats.forEach(m => matCost += Number(m.total)||0);
                
                const exps = r.expenses.filter(ex => ex.projId === p.id);
                exps.forEach(ex => othCost += Number(ex.total)||0);

                if(dayAdded || mats.length>0 || exps.length>0) {
                  recs.push({ date: r.date, workers: dayWorkers, tasks: Array.from(dayTasks).join('、'), mats, exps, originalRecord: r });
                }
              });

              recs.sort((a,b)=>a.date.localeCompare(b.date));
              
              const billings = JSON.parse(localStorage.getItem('v8_billings') || '{}');
              let totalBill = 0;
              Object.keys(billings).forEach(k => { if(k.startsWith(p.id)) totalBill += billings[k]; });

              return { ...p, recs, salCost, matCost, othCost, totalCost: salCost+matCost+othCost, totalBill };
            }).filter(p => p.recs.length > 0);
          }, [projects, records, projFilter]);

          return (
            <div className="space-y-2">
              <Card>
                <select value={projFilter} onChange={e=>setProjFilter(e.target.value)} className="w-full p-2 border border-slate-200 rounded-lg bg-slate-50 font-bold outline-none text-xs">
                  <option value="全部">全部工程紀錄</option>
                  {projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </Card>

              {pStats.map(p => (
                <Card key={p.id} className="p-0 overflow-hidden border-slate-200">
                  <div onClick={()=>toggle(p.id)} className="p-3 bg-white cursor-pointer active:bg-slate-50 transition-colors select-none">
                    <div className="flex justify-between items-start mb-2.5">
                      <div>
                        <div className="font-extrabold text-sm mb-0.5 text-slate-800">{p.name} <span className="text-[11px] text-slate-500 font-medium ml-1">| 客戶：{p.client}</span></div>
                      </div>
                      <span className={`w-5 h-5 bg-slate-100 flex items-center justify-center rounded text-[10px] font-bold ${expandedObj[p.id]?'text-blue-600 bg-blue-50':'text-slate-500'}`}>{expandedObj[p.id]?'▲':'▼'}</span>
                    </div>
                    <div className="grid grid-cols-4 gap-1.5 text-center text-[10px] font-bold">
                      <div className="bg-slate-50 rounded-lg p-1.5 border border-slate-100"><span className="text-slate-400 block mb-0.5 text-[9px]">人工費</span>${Math.round(p.salCost).toLocaleString()}</div>
                      <div className="bg-slate-50 rounded-lg p-1.5 border border-slate-100"><span className="text-slate-400 block mb-0.5 text-[9px]">材料費</span>${p.matCost.toLocaleString()}</div>
                      <div className="bg-slate-50 rounded-lg p-1.5 border border-slate-100"><span className="text-slate-400 block mb-0.5 text-[9px]">其他費用</span>${p.othCost.toLocaleString()}</div>
                      <div className="bg-blue-50 text-blue-700 rounded-lg p-1.5 border border-blue-100"><span className="text-blue-400 block mb-0.5 text-[9px]">總請款金額</span><span className="text-xs font-black">${p.totalBill.toLocaleString()}</span></div>
                    </div>
                  </div>

                  {expandedObj[p.id] && (
                    <div className="p-2 bg-slate-50 border-t border-slate-100 space-y-1.5 text-[10px]">
                      {p.recs.map((r, i) => (
                        <div key={i} className="bg-white border border-slate-200 rounded-lg overflow-hidden shadow-2xs">
                          <div onClick={(e)=>toggle(`${p.id}_${r.date}`, e)} className="flex items-center gap-2 p-2 cursor-pointer hover:bg-slate-50">
                            <div className="font-mono text-slate-500 w-12 shrink-0 bg-slate-100 px-1 py-0.5 rounded text-center font-bold">{r.date.slice(5)}</div>
                            <div className="w-8 text-center font-bold text-slate-600 shrink-0 bg-slate-50 rounded py-0.5">{r.workers.length}人</div>
                            <div className="flex-1 font-bold text-slate-700 truncate">{r.tasks || '無摘要'}</div>
                            <button onClick={(e)=>{e.stopPropagation(); onEdit(r.originalRecord);}} className="text-[10px] bg-blue-100 hover:bg-blue-200 text-blue-700 px-2.5 py-1 rounded font-bold shrink-0 transition-colors">編輯</button>
                            <div className="text-[8px] text-slate-400 font-bold ml-1">{expandedObj[`${p.id}_${r.date}`]?'▲':'▼'}</div>
                          </div>
                          
                          {expandedObj[`${p.id}_${r.date}`] && (
                            <div className="p-2 bg-slate-50/80 border-t border-slate-100 space-y-1">
                              {r.workers.length>0 && <div className="text-slate-700 font-bold mb-1">出席人員: <span className="text-blue-600">{r.workers.join('、')}</span></div>}
                              {r.mats.map((m,j) => <div key={'m'+j} className="flex justify-between items-center text-slate-600 bg-white px-1.5 py-1 rounded border border-slate-100"><span className="truncate flex-1">📦 {m.name} <span className="text-[9px] text-slate-400">(x{m.qty})</span></span><span className="shrink-0 ml-2 font-bold">${m.total}</span></div>)}
                              {r.exps.map((ex,j) => <div key={'e'+j} className="flex justify-between items-center text-slate-600 bg-white px-1.5 py-1 rounded border border-slate-100"><span className="truncate flex-1">⛽ {ex.name}</span><span className="shrink-0 ml-2 font-bold">${ex.total}</span></div>)}
                              {r.mats.length === 0 && r.exps.length === 0 && <div className="text-slate-400 text-[9px] italic">無物料與其他費用紀錄</div>}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </Card>
              ))}
              {pStats.length===0 && <div className="text-center text-slate-400 py-6 font-bold bg-white rounded-lg border border-slate-200">尚無工程紀錄</div>}
            </div>
          );
        }

        function TabReport({ records, projects, onEdit, onDelete, initialMonth }) {
          const [month, setMonth] = useState(initialMonth || new Date().toISOString().slice(0,7));
          const [expandedRecs, setExpandedRecs] = useState({});
          
          useEffect(() => {
            if (initialMonth) setMonth(initialMonth);
          }, [initialMonth]);

          const filtered = records.filter(r => r.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date));
          
          const toggleRec = (id) => setExpandedRecs(p => ({...p, [id]: !p[id]}));

          const stats = useMemo(() => {
             let cost=0, billing=0, projSet=new Set();
             filtered.forEach(r => {
                let rCost = 0, rBill = 0;
                r.employees.forEach(e => { 
                   rCost += Number(e.salary)||0; 
                   (e.allowances||[]).forEach(a => rCost += Number(a.amount)||0);
                   e.projects.filter(p=>p.projId).forEach(p=>projSet.add(p.projId)); 
                });
                r.materials.forEach(m => { rCost += Number(m.total)||0; if(m.billable) rBill += Number(m.total)||0; });
                r.expenses.forEach(ex => { rCost += Number(ex.total)||0; if(ex.billable) rBill += Number(ex.total)||0; });
                cost += rCost; billing += rBill;
             });
             return { cost, billing, profit: billing-cost, workDays: new Set(filtered.map(x=>x.date)).size, projCount: projSet.size };
          }, [filtered]);

          const getRecordDisplay = (r) => {
            const pIds = new Set();
            let rCost = 0, rBill = 0;
            
            r.employees.forEach(e => {
              rCost += Number(e.salary)||0;
              (e.allowances||[]).forEach(a => rCost += Number(a.amount)||0);
              e.projects.filter(p=>p.projId).forEach(p=>pIds.add(p.projId));
            });
            r.materials.forEach(m => { rCost += Number(m.total)||0; if(m.billable) rBill += Number(m.total)||0; if(m.projId) pIds.add(m.projId); });
            r.expenses.forEach(ex => { rCost += Number(ex.total)||0; if(ex.billable) rBill += Number(ex.total)||0; if(ex.projId) pIds.add(ex.projId); });
            
            const pNames = Array.from(pIds).map(id => projects.find(x => x.id === id)?.name).filter(Boolean);
            const clients = Array.from(pIds).map(id => projects.find(x => x.id === id)?.client).filter(Boolean);
            
            return {
               names: pNames.length > 0 ? pNames.join('、') : '無指定工程',
               client: clients.length > 0 ? [...new Set(clients)].join('、') : '無',
               cost: rCost,
               billing: rBill
            };
          };

          return (
            <div className="space-y-3">
              <div className="bg-slate-900 text-white p-3 rounded-xl flex justify-between items-center shadow-lg">
                <input type="month" value={month} onChange={e=>setMonth(e.target.value)} className="bg-slate-800 text-white font-bold text-xs p-1 rounded outline-none border border-slate-700 cursor-pointer" />
                <span className="font-extrabold text-xs">探金小秘書</span>
              </div>

              <div className="flex gap-2">
                <div className="flex-1 bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
                  <div className="text-[10px] font-bold text-slate-400 mb-1">總成本 / 總請款</div>
                  <div className="font-black text-[13px] mb-2">${stats.cost.toLocaleString()} / <span className="text-blue-600">${stats.billing.toLocaleString()}</span></div>
                  <div className="text-[10px] font-bold text-slate-400 mb-1">總利潤</div>
                  <div className="font-black text-lg text-emerald-500 mb-2">${stats.profit.toLocaleString()}</div>
                  <div className="flex justify-between text-[10px] font-bold pt-2 border-t border-slate-100 text-slate-500">
                    <span>工程數 <span className="text-slate-800 text-xs ml-0.5">{stats.projCount}</span></span>
                    <span>工作天 <span className="text-slate-800 text-xs ml-0.5">{stats.workDays}</span></span>
                  </div>
                </div>
                
                <div className="flex-[1.2] bg-white p-2 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                  <div className="text-[10px] font-bold text-slate-500 mb-1.5 border-b border-slate-100 pb-1 text-center">當月日曆</div>
                  <div className="grid grid-cols-7 gap-0.5 text-[9px] font-bold text-slate-400 mb-1 text-center">
                    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                  </div>
                  <div className="grid grid-cols-7 gap-0.5 text-[11px] font-bold text-center flex-1">
                    {Array.from({length: new Date(month.slice(0,4), month.slice(5,7)-1, 1).getDay()}).map((_,i)=><div key={'e'+i}/>)}
                    {Array.from({length: new Date(month.slice(0,4), month.slice(5,7), 0).getDate()}).map((_,i) => {
                      const d = `${month}-${String(i+1).padStart(2,'0')}`;
                      const recs = filtered.filter(r => r.date === d);
                      const hasWork = recs.some(r => r.employees.some(e=>e.dayType!=='休假'));
                      const hasHoliday = recs.some(r => r.employees.some(e=>e.dayType==='休假'));
                      
                      let cls = 'text-slate-400';
                      if(hasWork) cls = 'bg-sky-100 text-sky-700 shadow-sm rounded-md';
                      else if(hasHoliday) cls = 'bg-amber-100 text-amber-700 shadow-sm rounded-md';

                      return <div key={i} className={`aspect-square flex items-center justify-center ${cls}`}>{i+1}</div>;
                    })}
                  </div>
                </div>
              </div>

              <div className="font-bold text-xs text-slate-600 flex items-center gap-1 mt-2 mb-1"><span className="text-base">📋</span> 本月日報明細 (按日期排序)</div>
              
              <div className="space-y-2">
                {filtered.map(r => {
                  const disp = getRecordDisplay(r);
                  const isExp = expandedRecs[r.id];
                  return (
                    <div key={r.id} className="border border-slate-200 rounded-xl bg-white shadow-2xs overflow-hidden transition-all">
                      <div onClick={() => toggleRec(r.id)} className="p-2.5 flex justify-between items-center text-xs gap-2 cursor-pointer hover:bg-slate-50">
                        <div className="flex items-center gap-2 flex-1 min-w-0">
                          <span className="text-[10px] bg-slate-100 px-1.5 py-0.5 rounded font-mono text-slate-600 font-bold whitespace-nowrap shrink-0">{r.date.slice(5)}</span>
                          <div className="min-w-0 flex-1">
                            <div className="font-extrabold text-slate-800 text-[11px] truncate mb-0.5">{disp.names}</div>
                            <p className="text-[9px] text-slate-500 font-medium truncate">請款 <strong className="text-blue-600">${disp.billing.toLocaleString()}</strong> | 成本 ${disp.cost.toLocaleString()}</p>
                          </div>
                        </div>
                        <div className="flex shrink-0 items-center gap-1.5">
                           <span className="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded font-bold">{r.employees.length}人</span>
                           <span className={`text-[9px] text-slate-400 font-bold transition-transform ${isExp?'rotate-180':''}`}>▼</span>
                        </div>
                      </div>

                      {isExp && (
                        <div className="p-2.5 pt-1.5 bg-slate-50 border-t border-slate-100">
                           <div className="space-y-1.5">
                             {r.employees.length > 0 && (
                               <div className="text-[10px]">
                                 <div className="font-bold text-slate-500 mb-1 border-b border-slate-200 pb-0.5">👷 出勤人員</div>
                                 <div className="space-y-1">
                                   {r.employees.map(e => (
                                     <div key={e.id} className="flex gap-1.5 items-start bg-white border border-slate-100 p-1.5 rounded shadow-2xs">
                                       <span className={`shrink-0 w-8 text-center font-bold rounded px-1 py-0.5 ${e.dayType==='休假'?'bg-amber-100 text-amber-700':'bg-blue-100 text-blue-700'}`}>{e.name}</span>
                                       <span className="shrink-0 text-slate-400 py-0.5">{e.dayType}</span>
                                       <div className="flex-1 min-w-0">
                                         {e.projects.map(p => {
                                           const pName = projects.find(x=>x.id===p.projId)?.name || '無指定工程';
                                           return <div key={p.id} className="truncate text-slate-700">{pName}{p.taskName ? ` - ${p.taskName}` : ''}</div>;
                                         })}
                                       </div>
                                       {(e.allowances||[]).map(a => (
                                          <div key={a.id} className="shrink-0 text-emerald-600 font-bold bg-emerald-50 px-1 py-0.5 rounded text-[9px]">{a.name} ${a.amount}</div>
                                       ))}
                                     </div>
                                   ))}
                                 </div>
                               </div>
                             )}
                             
                             {(r.materials.length > 0 || r.expenses.length > 0) && (
                               <div className="text-[10px] mt-2">
                                 <div className="font-bold text-slate-500 mb-1 border-b border-slate-200 pb-0.5">📦 物品與費用</div>
                                 <div className="space-y-1">
                                   {r.materials.map(m => (
                                     <div key={m.id} className="flex justify-between items-center bg-white border border-slate-100 p-1.5 rounded shadow-2xs">
                                       <span className="truncate flex-1 font-medium">{m.name} <span className="text-slate-400 text-[9px] ml-1">x{m.qty}</span></span>
                                       <span className="font-bold text-slate-600 shrink-0 ml-2">${m.total}</span>
                                     </div>
                                   ))}
                                   {r.expenses.map(ex => (
                                     <div key={ex.id} className="flex justify-between items-center bg-white border border-slate-100 p-1.5 rounded shadow-2xs">
                                       <span className="truncate flex-1 font-medium text-amber-700">{ex.name}</span>
                                       <span className="font-bold text-slate-600 shrink-0 ml-2">${ex.total}</span>
                                     </div>
                                   ))}
                                 </div>
                               </div>
                             )}
                           </div>
                           
                           <div className="flex justify-end gap-2 mt-2 pt-2 border-t border-slate-200">
                              <button onClick={(e) => { e.stopPropagation(); onEdit(r); }} className="px-4 py-1.5 bg-blue-100 text-blue-700 hover:bg-blue-200 rounded text-[11px] font-bold transition-colors">📝 編輯日報</button>
                              <button onClick={(e) => { e.stopPropagation(); onDelete(r.id); }} className="px-4 py-1.5 bg-rose-100 text-rose-700 hover:bg-rose-200 rounded text-[11px] font-bold transition-colors">🗑️ 刪除</button>
                           </div>
                        </div>
                      )}
                    </div>
                  );
                })}
                {filtered.length===0 && <div className="text-center text-slate-400 py-8 font-bold bg-white rounded-xl border border-slate-200">無紀錄</div>}
              </div>
            </div>
          );
        }

        function TabStats({ records }) {
          const [type, setType] = useState('全部');
          
          const projects = JSON.parse(localStorage.getItem('v8_projects')||'[]');
          const pTypeMap = {}; projects.forEach(p=>pTypeMap[p.id]=p.type);

          const stats = useMemo(() => {
            let totalBill=0, laborCost=0, matCost=0, othCost=0, count=0;
            records.forEach(r => {
               const validProjs = r.employees.flatMap(e=>e.projects.map(p=>p.projId)).filter(id => type==='全部' || pTypeMap[id]===type);
               if(type!=='全部' && validProjs.length===0) return; 
               
               count++;
               r.employees.forEach(e => {
                  laborCost += Number(e.salary)||0;
                  (e.allowances||[]).forEach(a => laborCost += Number(a.amount)||0);
               });
               r.materials.forEach(m => { matCost += Number(m.total)||0; if(m.billable) totalBill+=Number(m.total)||0; });
               r.expenses.forEach(ex => { othCost += Number(ex.total)||0; if(ex.billable) totalBill+=Number(ex.total)||0; });
               
               validProjs.forEach(pid => {
                 const bKey = `${pid}_${r.date.slice(0,7)}`;
                 const billings = JSON.parse(localStorage.getItem('v8_billings') || '{}');
                 if(billings[bKey]) totalBill += billings[bKey]/30; 
               });
            });
            const totalCost = laborCost+matCost+othCost;
            return { totalBill, totalCost, profit: totalBill-totalCost, laborCost, matCost, othCost, count };
          }, [records, type, pTypeMap]);

          const pLabor = stats.totalCost ? (stats.laborCost/stats.totalCost*100) : 0;
          const pMat = stats.totalCost ? (stats.matCost/stats.totalCost*100) : 0;
          const pOth = stats.totalCost ? (stats.othCost/stats.totalCost*100) : 0;

          return (
            <div className="space-y-3">
               <div className="flex gap-1 bg-white p-1 rounded-xl border border-slate-200 text-xs font-bold shadow-2xs">
                 {['全部', '發包', '計時', '維修'].map(t => (
                   <button key={t} onClick={()=>setType(t)} className={`flex-1 py-2 rounded-lg transition-colors ${type===t?'bg-blue-600 text-white shadow-sm':'text-slate-500 hover:bg-slate-50'}`}>{t}</button>
                 ))}
               </div>

               <Card className="border-t-4 border-t-blue-500 rounded-xl shadow-sm">
                 <div className="flex justify-between items-center mb-3">
                   <div className="font-extrabold text-sm">{type}工程總計</div>
                   <div className="text-[10px] bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full font-bold">共 {stats.count} 筆</div>
                 </div>

                 <div className="grid grid-cols-3 gap-2 text-center mb-4">
                   <div className="bg-blue-50 p-2.5 rounded-lg border border-blue-100">
                     <div className="text-[10px] font-bold text-blue-600 mb-0.5">總請款</div>
                     <div className="font-black text-blue-700 text-sm">${stats.totalBill.toLocaleString()}</div>
                   </div>
                   <div className="bg-rose-50 p-2.5 rounded-lg border border-rose-100">
                     <div className="text-[10px] font-bold text-rose-600 mb-0.5">總成本</div>
                     <div className="font-black text-rose-700 text-sm">${stats.totalCost.toLocaleString()}</div>
                   </div>
                   <div className="bg-emerald-50 p-2.5 rounded-lg border border-emerald-100">
                     <div className="text-[10px] font-bold text-emerald-600 mb-0.5">總利潤</div>
                     <div className="font-black text-emerald-700 text-sm">${stats.profit.toLocaleString()}</div>
                   </div>
                 </div>

                 <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2.5">
                   <div className="text-[10px] font-bold text-slate-500 uppercase">成本結構分析</div>
                   <div className="grid grid-cols-3 gap-2 text-center">
                     <div className="bg-white p-2 rounded-lg border border-slate-200 shadow-2xs">
                       <span className="text-[10px] font-bold text-slate-500 block mb-0.5">👷 人工費</span>
                       <span className="font-extrabold text-xs block">${stats.laborCost.toLocaleString()}</span>
                       <span className="text-[9px] text-slate-400 block mt-0.5">{pLabor.toFixed(1)}%</span>
                     </div>
                     <div className="bg-white p-2 rounded-lg border border-slate-200 shadow-2xs">
                       <span className="text-[10px] font-bold text-slate-500 block mb-0.5">📦 材料費</span>
                       <span className="font-extrabold text-xs block">${stats.matCost.toLocaleString()}</span>
                       <span className="text-[9px] text-slate-400 block mt-0.5">{pMat.toFixed(1)}%</span>
                     </div>
                     <div className="bg-white p-2 rounded-lg border border-slate-200 shadow-2xs">
                       <span className="text-[10px] font-bold text-slate-500 block mb-0.5">⛽ 其他費</span>
                       <span className="font-extrabold text-xs block">${stats.othCost.toLocaleString()}</span>
                       <span className="text-[9px] text-slate-400 block mt-0.5">{pOth.toFixed(1)}%</span>
                     </div>
                   </div>
                   {stats.totalCost > 0 && (
                     <div className="flex h-2 rounded-full overflow-hidden mt-2 border border-slate-200/50 bg-slate-200">
                       <div style={{width:`${pLabor}%`}} className="bg-blue-500 transition-all"/>
                       <div style={{width:`${pMat}%`}} className="bg-emerald-500 transition-all"/>
                       <div style={{width:`${pOth}%`}} className="bg-amber-500 transition-all"/>
                     </div>
                   )}
                 </div>
               </Card>
            </div>
          );
        }

        function TabSettings({ settings, setSettings, projects, setProjects, records, setRecords, billings, setBillings, manualSalaries, setManualSalaries, showToast }) {
          const [n, setN] = useState('');
          const [f, setF] = useState(2500);
          const [h, setH] = useState(1300);
          const [importData, setImportData] = useState('');

          const updateEmpList = (index, field, value) => {
            setSettings(p => {
              const newEmp = [...p.employees];
              newEmp[index] = { ...newEmp[index], [field]: field==='name' ? value : Number(value)||0 };
              return { ...p, employees: newEmp };
            });
          };

          const addEmp = (e) => {
            e.preventDefault();
            if(!n) return;
            setSettings(p => ({ ...p, employees: [...p.employees, { name: n, fullRate: Number(f)||0, halfRate: Number(h)||0 }] }));
            setN(''); setF(2500); setH(1300);
          };

          const rmEmp = (index) => setSettings(p => ({ ...p, employees: p.employees.filter((_, i) => i !== index) }));

          const exportText = async () => {
            const data = JSON.stringify({ settings, projects, records, billings, manualSalaries });
            const ok = await copyToClipboard(data);
            if(ok) showToast('備份代碼已複製，請妥善保存'); else alert('複製失敗，請手動複製');
          };

          const doImport = () => {
            if(!importData.trim()) return alert('請貼上備份代碼');
            try {
              const parsed = JSON.parse(importData);
              if(parsed.settings) setSettings(parsed.settings);
              if(parsed.projects) setProjects(parsed.projects);
              if(parsed.records) setRecords(parsed.records);
              if(parsed.billings) setBillings(parsed.billings);
              if(parsed.manualSalaries) setManualSalaries(parsed.manualSalaries);
              showToast('還原成功！'); setImportData('');
            } catch(e) { alert('備份代碼格式錯誤'); }
          };

          return (
            <div className="space-y-3">
              <Card>
                <div className="font-bold text-slate-600 mb-3 border-b pb-1.5 uppercase text-[11px]">員工薪水設定</div>
                <div className="space-y-2 mb-4">
                  {settings.employees.map((e, index) => (
                    <div key={index} className="flex gap-1.5 items-center bg-slate-50 p-2 rounded-lg border border-slate-200 text-[11px]">
                      <input type="text" value={e.name} onChange={ev=>updateEmpList(index, 'name', ev.target.value)} className="flex-[1.5] p-1.5 border border-slate-200 rounded font-bold outline-none text-slate-800" placeholder="姓名" />
                      <div className="flex items-center gap-1 flex-1 relative">
                        <label className="absolute -top-2 left-1.5 bg-slate-50 px-0.5 text-[8px] text-slate-400 font-bold">全日</label>
                        <input type="number" value={e.fullRate} onChange={ev=>updateEmpList(index, 'fullRate', ev.target.value)} className="w-full p-1.5 pt-1 border border-slate-200 rounded outline-none text-right font-bold text-slate-700" />
                      </div>
                      <div className="flex items-center gap-1 flex-1 relative">
                        <label className="absolute -top-2 left-1.5 bg-slate-50 px-0.5 text-[8px] text-slate-400 font-bold">半日</label>
                        <input type="number" value={e.halfRate} onChange={ev=>updateEmpList(index, 'halfRate', ev.target.value)} className="w-full p-1.5 pt-1 border border-slate-200 rounded outline-none text-right font-bold text-slate-700" />
                      </div>
                      <button onClick={()=>rmEmp(index)} className="text-red-400 hover:bg-red-50 p-1.5 rounded font-bold shrink-0">✕</button>
                    </div>
                  ))}
                  {settings.employees.length === 0 && <div className="text-center text-slate-400 py-2 text-[10px]">無員工名單</div>}
                </div>
                
                <form onSubmit={addEmp} className="flex gap-1.5 pt-3 border-t border-slate-100">
                  <input type="text" placeholder="新增姓名" value={n} onChange={e=>setN(e.target.value)} className="w-1/3 p-2 border border-slate-200 rounded-lg outline-none font-bold" />
                  <input type="number" placeholder="全日薪" value={f} onChange={e=>setF(e.target.value)} className="w-1/4 p-2 border border-slate-200 rounded-lg outline-none" />
                  <input type="number" placeholder="半日薪" value={h} onChange={e=>setH(e.target.value)} className="w-1/4 p-2 border border-slate-200 rounded-lg outline-none" />
                  <button type="submit" className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-sm text-[11px] transition-colors">新增</button>
                </form>
              </Card>

              <Card>
                <div className="font-bold text-slate-600 mb-3 border-b pb-1.5 uppercase text-[11px]">系統資料備份與還原</div>
                <button onClick={exportText} className="w-full bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-lg font-bold mb-4 shadow-sm transition-colors text-sm">📋 複製系統備份代碼</button>
                
                <div className="bg-slate-50 p-2 rounded-lg border border-slate-200">
                  <textarea value={importData} onChange={e=>setImportData(e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg text-[10px] font-mono outline-none h-20 mb-2 bg-white" placeholder="在此貼上備份代碼以還原資料..."></textarea>
                  <button onClick={doImport} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-bold shadow-sm transition-colors text-sm">📥 執行資料還原</button>
                </div>
              </Card>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
